<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- 外框徽章 -->
  <path d="M10 20 C10 8, 20 2, 32 2 L288 2 C300 2, 310 8, 310 20 L310 60 C310 72, 300 78, 288 78 L32 78 C20 78, 10 72, 10 60 Z" fill="rgba(8,14,26,0.85)" stroke="#4db8e8" stroke-width="1.5"/>
  <path d="M14 22 C14 12, 22 6, 32 6 L288 6 C298 6, 306 12, 306 22 L306 58 C306 68, 298 74, 288 74 L32 74 C22 74, 14 68, 14 58 Z" stroke="rgba(77,184,232,0.25)" stroke-width="1" fill="none"/>

  <!-- 左侧火柴人（持枪） -->
  <g transform="translate(52,40)">
    <!-- 身体 -->
    <circle cx="0" cy="-18" r="5" fill="#eef5ff"/>
    <line x1="0" y1="-13" x2="0" y2="8" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="-10" y2="4" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="10" y2="-2" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="-7" y2="20" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="7" y2="20" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 枪 -->
    <line x1="8" y1="-4" x2="22" y2="-8" stroke="#d4953a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="-8" x2="22" y2="-6" stroke="#d4953a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 右侧火柴人（持刀盾） -->
  <g transform="translate(96,40) scale(-1,1)">
    <circle cx="0" cy="-18" r="5" fill="#eef5ff"/>
    <line x1="0" y1="-13" x2="0" y2="8" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="-10" y2="4" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="10" y2="-2" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="-7" y2="20" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="7" y2="20" stroke="#eef5ff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 刀 -->
    <line x1="8" y1="-4" x2="20" y2="-12" stroke="#a83035" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="-10" x2="20" y2="-12" stroke="#a83035" stroke-width="2" stroke-linecap="round"/>
    <!-- 盾 -->
    <path d="M-12 -6 L-12 10 C-12 16, -4 18, -4 18 C-4 18, 4 16, 4 10 L4 -6 C4 -10, 0 -12, 0 -12 C0 -12, -4 -10, -4 -6 Z" stroke="#4db8e8" stroke-width="1.8" fill="rgba(77,184,232,0.12)"/>
  </g>

  <!-- 分割线 -->
  <line x1="128" y1="18" x2="128" y2="62" stroke="rgba(77,184,232,0.25)" stroke-width="1"/>

  <!-- 文字 -->
  <text x="160" y="38" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="900" fill="#eef5ff" letter-spacing="0.12em">果沐兄弟</text>
  <text x="160" y="58" text-anchor="middle" font-family="'Orbitron','Rajdhani',sans-serif" font-size="10" font-weight="600" fill="#d4953a" letter-spacing="0.28em">STICKMAN ASSAULT PROTOCOL</text>
</svg>
